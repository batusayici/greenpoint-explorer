<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's on in Greenpoint, Brooklyn this week — Stoopwise</title>
    <!-- The rollback origins (greenpoint.life, greenpoint-explorer.vercel.app)
         serve this same page, so `/` needs a canonical the way card pages do —
         without it the root is two indexable copies. injectCardPage REPLACES
         this tag per card; keep it a single-line <link> so that match holds. -->
    <link rel="canonical" href="https://stoopwise.com/" />
    <meta
      name="description"
      content="What's on in Greenpoint this week — events, new openings, deals, and how to support the neighborhood's locally owned businesses. Verified and mapped."
    />
    <!-- Share preview (Phase 3.1). Absolute URLs are required by OG scrapers;
         origin is stoopwise.com since the 2026-08-06 rename. site_name is the
         parent brand (Stoopwise); the title carries the edition, which is what
         keeps "Greenpoint" in every share preview and search result. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stoopwise" />
    <meta property="og:title" content="What's on in Greenpoint, Brooklyn this week — Stoopwise" />
    <meta
      property="og:description"
      content="What's happening in Greenpoint this week — events, new openings, deals, and neighborhood news, verified and mapped. Every business locally owned."
    />
    <meta property="og:url" content="https://stoopwise.com/" />
    <meta property="og:image" content="https://stoopwise.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What's on in Greenpoint, Brooklyn this week — Stoopwise" />
    <meta
      name="twitter:description"
      content="What's happening in Greenpoint this week — events, new openings, deals, and neighborhood news, verified and mapped."
    />
    <meta name="twitter:image" content="https://stoopwise.com/og.png" />
    <!-- Identity mark (2026-08-12, pre-seed QA): the Stoopwise stoop glyph —
         ink steps + amber pin, strictly II-C. Before this the tab showed a
         blank glyph and iOS "Add to Home Screen" (the word-of-mouth install
         path) fell back to a page screenshot. SVG first, ICO for the
         legacy/Safari path, 180px touch icon, manifest for the home-screen
         name + start_url (?src=homescreen keeps installs attributable). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#eae1ce" />
    <!-- Map first-paint (2026-08-08 audit item 2): MapLibre can't request a
         single tile until it has fetched the TileJSON at /planet — a full
         extra round trip serialized behind JS boot. Preconnect opens the
         connection during HTML parse; the fetch preload gets the TileJSON
         (CORS *, cache-control 24h) into the HTTP cache before the map
         constructs. Chrome logs "preloaded but not used" because MapLibre's
         request comes from a worker context the preload matcher can't see —
         the response still lands in the shared HTTP cache (no Vary header,
         verified 2026-08-08) and serves MapLibre without a network trip, so
         the warning is cosmetic; do not "fix" it by removing the preload.
         Glyph/tile requests reuse the same warmed origin. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preload" href="https://tiles.openfreemap.org/planet" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demand-test/main.jsx"></script>
  </body>
</html>
