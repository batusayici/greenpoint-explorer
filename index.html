<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's on in Greenpoint, Brooklyn this week — Stoopwise</title>
    <!-- The rollback origins (greenpoint.life, greenpoint-explorer.vercel.app)
         serve this same page, so `/` needs a canonical the way card pages do —
         without it the root is two indexable copies. injectCardPage REPLACES
         this tag per card; keep it a single-line <link> so that match holds. -->
    <link rel="canonical" href="https://stoopwise.com/" />
    <meta
      name="description"
      content="What's on in Greenpoint this week — events, new openings, deals, and how to support the neighborhood's locally owned businesses. Verified and mapped."
    />
    <!-- Share preview (Phase 3.1). Absolute URLs are required by OG scrapers;
         origin is stoopwise.com since the 2026-08-06 rename. site_name is the
         parent brand (Stoopwise); the title carries the edition, which is what
         keeps "Greenpoint" in every share preview and search result. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stoopwise" />
    <meta property="og:title" content="What's on in Greenpoint, Brooklyn this week — Stoopwise" />
    <meta
      property="og:description"
      content="What's happening in Greenpoint this week — events, new openings, deals, and neighborhood news, verified and mapped. Every business locally owned."
    />
    <meta property="og:url" content="https://stoopwise.com/" />
    <meta property="og:image" content="https://stoopwise.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What's on in Greenpoint, Brooklyn this week — Stoopwise" />
    <meta
      name="twitter:description"
      content="What's happening in Greenpoint this week — events, new openings, deals, and neighborhood news, verified and mapped."
    />
    <meta name="twitter:image" content="https://stoopwise.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demand-test/main.jsx"></script>
  </body>
</html>
