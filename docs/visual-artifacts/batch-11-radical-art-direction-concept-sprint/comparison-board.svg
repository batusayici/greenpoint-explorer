    <text x="0" y="70" font-size="18">Recommended survivors from Codex review: Soft Pixel Neighborhood Sim and Inked Indie Graphic Novel.</text>
    <text x="0" y="102" font-size="18">No direction is approved by this board. The next batch should test UI/world integration, markers/cards, style tiles, and production viability.</text>
