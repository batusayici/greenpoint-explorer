    <g transform="translate(1224 580)">
      <rect x="0" y="0" width="528" height="396" fill="#ffffff" stroke="#c8c1b5"/>
      <image href="../batch-12-radical-hero-style-frames/06-weird-hyperlocal-magical-realism.png" x="0" y="0" width="528" height="352" preserveAspectRatio="xMidYMid slice"/>
