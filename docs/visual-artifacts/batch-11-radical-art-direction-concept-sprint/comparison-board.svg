<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420">
  <title>Batch 11 Hero Frame Comparison Board</title>
  <rect width="1800" height="1420" fill="#f4f1ea"/>
  <text x="48" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#202020">Batch 11 Radical Art-Direction Hero Frames</text>
  <text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555">Direction-selection contact sheet. Not final art approval.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(48 130)">
      <rect x="0" y="0" width="528" height="396" fill="#ffffff" stroke="#c8c1b5"/>
      <image href="../batch-12-radical-hero-style-frames/01-soft-pixel-neighborhood-sim.png" x="0" y="0" width="528" height="352" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="352" width="528" height="44" fill="#ffffff"/>
      <text x="16" y="380" font-size="18" font-weight="700" fill="#202020">1. Soft Pixel Neighborhood Sim</text>
    </g>

    <g transform="translate(636 130)">
      <rect x="0" y="0" width="528" height="396" fill="#ffffff" stroke="#c8c1b5"/>
      <image href="../batch-12-radical-hero-style-frames/02-xerox-riso-street-zine.png" x="0" y="0" width="528" height="352" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="352" width="528" height="44" fill="#ffffff"/>
      <text x="16" y="380" font-size="18" font-weight="700" fill="#202020">2. Xerox-Riso Street Zine</text>
    </g>

    <g transform="translate(1224 130)">
      <rect x="0" y="0" width="528" height="396" fill="#ffffff" stroke="#c8c1b5"/>
      <image href="../batch-12-radical-hero-style-frames/03-tilt-shift-toy-block-greenpoint.png" x="0" y="0" width="528" height="352" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="352" width="528" height="44" fill="#ffffff"/>
      <text x="16" y="380" font-size="18" font-weight="700" fill="#202020">3. Tilt-Shift Toy Block Greenpoint</text>
    </g>

    <g transform="translate(48 580)">
      <rect x="0" y="0" width="528" height="396" fill="#ffffff" stroke="#c8c1b5"/>
      <image href="../batch-12-radical-hero-style-frames/04-inked-indie-graphic-novel.png" x="0" y="0" width="528" height="352" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="352" width="528" height="44" fill="#ffffff"/>
      <text x="16" y="380" font-size="18" font-weight="700" fill="#202020">4. Inked Indie Graphic Novel</text>
    </g>

    <g transform="translate(636 580)">
      <rect x="0" y="0" width="528" height="396" fill="#ffffff" stroke="#c8c1b5"/>
      <image href="../batch-12-radical-hero-style-frames/05-civic-atlas-deluxe.png" x="0" y="0" width="528" height="352" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0" y="352" width="528" height="44" fill="#ffffff"/>
      <text x="16" y="380" font-size="18" font-weight="700" fill="#202020">5. Civic Atlas Deluxe</text>
