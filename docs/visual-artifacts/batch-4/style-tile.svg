<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Batch 4 style tile</title>
  <desc id="desc">Lo-fi exploratory style tile for Storefront Sticker Diorama.</desc>
  <defs>
    <style>
      .bg { fill: #f4ecd8; }
      .panel { fill: #fff8e8; stroke: #151515; stroke-width: 4; }
      .ink { fill: #151515; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .small { font-size: 18px; }
      .med { font-size: 24px; font-weight: 700; }
      .big { font-size: 34px; font-weight: 800; }
      .note { fill: #3c3c3c; font-size: 16px; }
      .outline { stroke: #151515; stroke-linejoin: round; stroke-linecap: square; }
      .brick { fill: #bc5a45; stroke: #151515; stroke-width: 5; }
      .cream { fill: #f3ddab; stroke: #151515; stroke-width: 4; }
      .green { fill: #6e986f; stroke: #151515; stroke-width: 4; }
      .asphalt { fill: #59646b; stroke: #151515; stroke-width: 3; }
      .accent { fill: #dbff46; stroke: #151515; stroke-width: 4; }
      .red { fill: #f06a4a; stroke: #151515; stroke-width: 4; }
      .blue { fill: #2f7edb; stroke: #151515; stroke-width: 4; }
      .thin { stroke-width: 2; }
      .mid { stroke-width: 4; }
      .heavy { stroke-width: 7; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="ink big" x="54" y="58">Style Tile: Storefront Sticker Diorama</text>
  <text class="ink med" x="54" y="92">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="122">Tests rough world treatment. Local specificity should be stronger than UI.</text>

  <rect class="panel" x="54" y="155" width="460" height="610"/>
  <text class="ink med" x="84" y="198">Building + sign band</text>

  <g transform="translate(160 330)">
    <polygon class="brick" points="0,210 128,145 286,224 158,290"/>
    <polygon class="brick" points="0,210 0,10 128,-55 128,145"/>
    <polygon class="brick" points="128,145 128,-55 286,24 286,224"/>
    <rect class="cream" x="25" y="108" width="177" height="46"/>
    <text class="ink med" x="42" y="139">SIGN BAND</text>
    <rect x="36" y="162" width="46" height="76" fill="#4b392f" stroke="#151515" stroke-width="4"/>
    <rect x="98" y="165" width="64" height="46" fill="#bde1e8" stroke="#151515" stroke-width="3"/>
    <rect x="178" y="165" width="62" height="46" fill="#bde1e8" stroke="#151515" stroke-width="3"/>
    <g opacity=".42">
      <line class="outline thin" x1="12" y1="35" x2="113" y2="-16"/>
      <line class="outline thin" x1="12" y1="62" x2="113" y2="11"/>
      <line class="outline thin" x1="12" y1="89" x2="113" y2="38"/>
    </g>
  </g>

  <text class="ink small" x="84" y="682">Rules:</text>
  <text class="ink note" x="84" y="712">Chunky massing, strong storefront base, simple upper floors.</text>
  <text class="ink note" x="84" y="738">Street-level detail carries local texture; upper stories stay calmer.</text>

  <rect class="panel" x="570" y="155" width="450" height="610"/>
  <text class="ink med" x="600" y="198">Surfaces + clutter</text>

  <g transform="translate(630 260)">
    <rect class="asphalt" x="0" y="310" width="330" height="85"/>
    <polygon fill="#c9c2ae" stroke="#151515" stroke-width="4" points="0,250 220,140 340,200 120,310"/>
    <rect x="48" y="221" width="70" height="42" fill="#597f62" stroke="#151515" stroke-width="4"/>
    <text class="ink small" x="54" y="248">TREE</text>
    <circle cx="178" cy="229" r="18" fill="#151515"/>
    <rect x="170" y="212" width="72" height="12" fill="#151515"/>
    <path d="M260 198 c18 -30 48 -30 68 0" fill="none" stroke="#151515" stroke-width="5"/>
    <rect x="274" y="210" width="40" height="24" fill="#f3ddab" stroke="#151515" stroke-width="4"/>
    <path d="M44 152 c15 -28 38 -26 48 0 c-15 22 -34 22 -48 0z" fill="#d9d3bd" stroke="#151515" stroke-width="3"/>
    <path d="M72 138 c10 -28 30 -24 36 4" fill="none" stroke="#151515" stroke-width="3"/>
  </g>

  <text class="ink small" x="600" y="682">Texture notes:</text>
  <text class="ink note" x="600" y="712">Use a few recognizable sidewalk objects, not prop soup.</text>
  <text class="ink note" x="600" y="738">Texture should feel handmade and local, but still clickable.</text>

  <rect class="panel" x="1076" y="155" width="470" height="610"/>
  <text class="ink med" x="1106" y="198">Line + palette samples</text>

  <g transform="translate(1110 240)">
    <rect class="brick" x="0" y="0" width="88" height="88"/>
    <rect class="cream" x="105" y="0" width="88" height="88"/>
    <rect class="green" x="210" y="0" width="88" height="88"/>
    <rect class="asphalt" x="315" y="0" width="88" height="88"/>
    <rect class="accent" x="0" y="116" width="88" height="88"/>
    <rect class="red" x="105" y="116" width="88" height="88"/>
    <rect class="blue" x="210" y="116" width="88" height="88"/>
    <rect fill="#fff8e8" stroke="#151515" stroke-width="4" x="315" y="116" width="88" height="88"/>
  </g>

  <g transform="translate(1122 510)">
    <line class="outline thin" x1="0" y1="0" x2="350" y2="0"/>
    <text class="ink note" x="0" y="28">thin detail</text>
    <line class="outline mid" x1="0" y1="70" x2="350" y2="70"/>
    <text class="ink note" x="0" y="98">medium world outline</text>
    <line class="outline heavy" x1="0" y1="140" x2="350" y2="140"/>
    <text class="ink note" x="0" y="168">heavy UI / key silhouette</text>
  </g>

  <text class="ink small" x="1106" y="682">Failure modes:</text>
  <text class="ink note" x="1106" y="712">Too clean = generic vector isometric.</text>
  <text class="ink note" x="1106" y="738">Too rough = noisy and hard to click.</text>
  <text class="ink note" x="54" y="830">This tile suggests treatment only. It is not final color, final architecture, or final asset style.</text>
</svg>

