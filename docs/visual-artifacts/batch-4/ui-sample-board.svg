<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Batch 4 UI sample board</title>
  <desc id="desc">Lo-fi exploratory UI marker and card samples for medium sticker direction.</desc>
  <defs>
    <style>
      .bg { fill: #f4ecd8; }
      .panel { fill: #fff8e8; stroke: #151515; stroke-width: 4; }
      .ink { fill: #151515; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .small { font-size: 18px; }
      .med { font-size: 24px; font-weight: 700; }
      .big { font-size: 34px; font-weight: 800; }
      .note { fill: #3c3c3c; font-size: 16px; }
      .card { fill: #fff8e8; stroke: #151515; stroke-width: 5; }
      .accent { fill: #dbff46; stroke: #151515; stroke-width: 4; }
      .red { fill: #f06a4a; stroke: #151515; stroke-width: 4; }
      .blue { fill: #2f7edb; stroke: #151515; stroke-width: 4; }
      .muted { fill: #d9d3bd; stroke: #151515; stroke-width: 3; }
      .building { fill: #bc5a45; stroke: #151515; stroke-width: 4; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="ink big" x="54" y="58">UI Sample Board</text>
  <text class="ink med" x="54" y="92">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="122">Tests medium sticker loudness. UI should invite clicks without overpowering local storefronts.</text>

  <rect class="panel" x="54" y="155" width="470" height="290"/>
  <text class="ink med" x="84" y="198">Hotspot marker options</text>
  <g transform="translate(92 238)">
    <polygon class="accent" points="42,0 78,46 42,92 6,46"/>
    <text class="ink small" x="0" y="132">A. angled diamond</text>
    <text class="ink note" x="0" y="160">Sims-adjacent, not plumbob.</text>
  </g>
  <g transform="translate(245 238)">
    <path class="red" d="M48 0 L66 28 L100 28 L74 50 L86 84 L48 64 L10 84 L22 50 L-4 28 L30 28 Z"/>
    <text class="ink small" x="-8" y="132">B. sticker burst</text>
    <text class="ink note" x="-8" y="160">More flyer, risk louder.</text>
  </g>
  <g transform="translate(400 244)">
    <path class="blue" d="M0 20 L90 0 L78 64 L18 78 Z"/>
    <text class="ink small" x="-8" y="126">C. tape tab</text>
    <text class="ink note" x="-8" y="154">Less gamey, more DIY.</text>
  </g>

  <rect class="panel" x="565" y="155" width="430" height="290"/>
  <text class="ink med" x="595" y="198">Label chip sample</text>
  <g transform="translate(610 255)">
    <rect class="card" x="0" y="0" width="290" height="62"/>
    <rect class="accent" x="-10" y="-10" width="52" height="28"/>
    <text class="ink med" x="26" y="40">Peter Pan Donuts</text>
    <text class="ink note" x="0" y="104">Chunky but compact. Should feel pasted on, not like a HUD.</text>
  </g>

  <rect class="panel" x="1036" y="155" width="510" height="615"/>
  <text class="ink med" x="1066" y="198">Rough place-card layout</text>
  <g transform="translate(1080 235)">
    <rect class="card" x="0" y="0" width="410" height="450"/>
    <rect class="accent" x="0" y="0" width="410" height="58"/>
    <text class="ink med" x="24" y="38">Peter Pan Donuts</text>
    <text class="ink small" x="24" y="95">Bakery / donut shop</text>
    <line x1="24" y1="118" x2="386" y2="118" stroke="#151515" stroke-width="3"/>
    <text class="ink small" x="24" y="158">A long-running Manhattan Ave</text>
    <text class="ink small" x="24" y="184">neighborhood bakery anchor.</text>
    <rect x="24" y="218" width="160" height="28" fill="#d9d3bd" stroke="#151515" stroke-width="3"/>
    <text class="ink note" x="34" y="238">727 Manhattan Ave</text>
    <rect x="24" y="284" width="362" height="54" fill="#f4ecd8" stroke="#151515" stroke-width="3"/>
    <text class="ink note" x="36" y="306">Source link / last verified</text>
    <text class="ink note" x="36" y="328">Unofficial neighborhood map</text>
    <text class="ink note" x="24" y="395">Card goal: charming, factual, no review language.</text>
  </g>

  <rect class="panel" x="54" y="485" width="942" height="285"/>
  <text class="ink med" x="84" y="528">UI loudness comparison</text>

  <g transform="translate(105 575)">
    <polygon class="building" points="0,100 70,66 150,105 78,140"/>
    <polygon class="building" points="0,100 0,30 70,-4 70,66"/>
    <polygon class="building" points="70,66 70,-4 150,34 150,105"/>
    <circle cx="94" cy="-10" r="11" fill="#dbff46" stroke="#151515" stroke-width="2"/>
    <text class="ink small" x="0" y="180">Too subtle</text>
    <text class="ink note" x="0" y="208">May disappear in a dense scene.</text>
  </g>

  <g transform="translate(410 575)">
    <polygon class="building" points="0,100 70,66 150,105 78,140"/>
    <polygon class="building" points="0,100 0,30 70,-4 70,66"/>
    <polygon class="building" points="70,66 70,-4 150,34 150,105"/>
    <polygon class="accent" points="98,-48 124,-14 98,20 72,-14"/>
    <rect class="card" x="118" y="-36" width="142" height="40"/>
    <text class="ink small" x="132" y="-10">Place</text>
    <text class="ink small" x="0" y="180">Medium sticker</text>
    <text class="ink note" x="0" y="208">Recommended working loudness.</text>
  </g>

  <g transform="translate(745 575)">
    <polygon class="building" points="0,100 70,66 150,105 78,140"/>
    <polygon class="building" points="0,100 0,30 70,-4 70,66"/>
    <polygon class="building" points="70,66 70,-4 150,34 150,105"/>
    <path class="red" d="M100 -80 L126 -35 L178 -38 L140 -3 L158 45 L102 20 L52 48 L66 -6 L28 -40 L78 -36 Z"/>
    <rect class="blue" x="132" y="-66" width="162" height="52"/>
    <text class="ink small" x="150" y="-34">CLICK!</text>
    <text class="ink small" x="0" y="180">Too loud</text>
    <text class="ink note" x="0" y="208">UI overpowers local world.</text>
  </g>

  <text class="ink note" x="54" y="835">Decision prompt: choose marker shape and confirm whether medium sticker is the right volume for the first lo-fi composition.</text>
</svg>

