<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Batch 8 marker and card in context</title>
  <desc id="desc">Lo-fi exploratory marker, label, and card hierarchy placed in storefront context.</desc>
  <style>
    .bg { fill: #f7eddc; }
    .panel { fill: #fff9ea; stroke: #101820; stroke-width: 4; }
    .street { fill: #657179; stroke: #101820; stroke-width: 4; }
    .sidewalk { fill: #d8cebb; stroke: #101820; stroke-width: 4; }
    .brick { fill: #a84c3f; stroke: #101820; stroke-width: 5; }
    .cream { fill: #edd6aa; stroke: #101820; stroke-width: 5; }
    .yellow { fill: #ffd26a; stroke: #101820; stroke-width: 4; }
    .green { fill: #2f7d5b; stroke: #101820; stroke-width: 4; }
    .marker { fill: #b7ff3c; stroke: #101820; stroke-width: 5; }
    .navy { fill: #163869; stroke: #101820; stroke-width: 4; }
    .red { fill: #d04f3e; stroke: #101820; stroke-width: 4; }
    .glass { fill: #91adb1; stroke: #101820; stroke-width: 3; }
    .ink { fill: #101820; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .white { fill: #fff9ea; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .big { font-size: 31px; font-weight: 900; }
    .med { font-size: 22px; font-weight: 850; }
    .small { font-size: 17px; font-weight: 650; }
    .note { font-size: 16px; }
  </style>

  <rect class="bg" width="1800" height="1040"/>
  <text class="ink big" x="54" y="62">Batch 8 - Marker + Card In Context</text>
  <text class="ink med" x="54" y="98">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="128">Tests hierarchy only. Community Pixel Storefront is a test path, not an approved final style.</text>

  <g transform="translate(70 178)">
    <rect class="panel" width="1020" height="725"/>
    <text class="ink med" x="28" y="48">In-context hierarchy test</text>
    <text class="ink note" x="28" y="78">Storefront/place should remain louder than marker, label, and card.</text>

    <polygon class="street" points="84,498 840,330 890,455 128,650"/>
    <polygon class="sidewalk" points="116,330 792,188 840,330 84,498"/>

    <g transform="translate(170 185)">
      <polygon class="brick" points="0,130 240,70 240,410 0,472"/>
      <polygon class="cream" points="240,70 470,130 470,472 240,410"/>
      <polygon class="yellow" points="34,178 214,134 214,202 34,246"/>
      <text class="ink med" x="56" y="198" transform="rotate(-14 56 198)">Peter Pan</text>
      <rect class="glass" x="292" y="158" width="62" height="76"/>
      <rect class="glass" x="382" y="184" width="62" height="76"/>
      <rect class="navy" x="74" y="308" width="110" height="132"/>
      <rect class="glass" x="278" y="338" width="154" height="78"/>

      <polygon class="marker" points="118,28 146,68 118,108 90,68"/>
      <rect class="panel" x="152" y="22" width="214" height="56"/>
      <rect class="red" x="152" y="22" width="18" height="56"/>
      <text class="ink small" x="184" y="58">Peter Pan Donuts</text>
    </g>

    <g transform="translate(610 188)">
      <rect class="green" x="0" y="0" width="110" height="92"/>
      <text class="white med" x="40" y="58">G</text>
      <rect class="green" x="136" y="-50" width="62" height="142"/>
      <text class="ink small" x="-22" y="132">transit anchor</text>
    </g>

    <g transform="translate(590 450)">
      <rect class="panel" x="0" y="0" width="360" height="210"/>
      <rect class="navy" x="0" y="0" width="360" height="58"/>
      <text class="white med" x="22" y="38">Peter Pan Donuts</text>
      <text class="ink small" x="22" y="92">Bakery</text>
      <text class="ink small" x="22" y="122">727 Manhattan Ave</text>
      <text class="ink note" x="22" y="154">Neutral factual copy only.</text>
      <line x1="22" y1="172" x2="338" y2="172" stroke="#101820" stroke-width="2"/>
      <text class="ink note" x="22" y="196">Source URL | Last verified | Unofficial map</text>
    </g>

    <text class="ink small" x="28" y="680">Question: does the marker read as a place/hotspot cue, not a character marker?</text>
  </g>

  <g transform="translate(1160 178)">
    <rect class="panel" width="570" height="725"/>
    <text class="ink med" x="28" y="48">Hierarchy notes</text>
    <text class="ink small" x="28" y="105">1. World first</text>
    <text class="ink note" x="28" y="135">Sign band and storefront mass should identify the place before the UI does.</text>

    <text class="ink small" x="28" y="205">2. Marker second</text>
    <polygon class="marker" points="56,236 82,272 56,308 30,272"/>
    <text class="ink note" x="112" y="266">Abstract diamond-tab cue.</text>
    <text class="ink note" x="112" y="294">No plumbob point, no face, no character ownership.</text>

    <text class="ink small" x="28" y="370">3. Label chip third</text>
    <rect class="panel" x="28" y="396" width="250" height="58"/>
    <rect class="red" x="28" y="396" width="18" height="58"/>
    <text class="ink small" x="62" y="432">Place label</text>
    <text class="ink note" x="28" y="494">Chunky and helpful, but not HUD-like.</text>

    <text class="ink small" x="28" y="570">4. Card after click/tap</text>
    <text class="ink note" x="28" y="604">Hybrid header can carry warmth.</text>
    <text class="ink note" x="28" y="632">Body stays factual and source/disclaimer-ready.</text>
    <text class="ink note" x="28" y="660">No event flyer, rating, review, quest, or endorsement implication.</text>
  </g>
</svg>

