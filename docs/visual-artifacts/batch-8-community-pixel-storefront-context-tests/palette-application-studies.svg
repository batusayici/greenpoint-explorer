<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Batch 8 palette application studies</title>
  <desc id="desc">Lo-fi exploratory applied palette studies on the same storefront fragment.</desc>
  <style>
    .bg { fill: #f7eddc; }
    .panel { fill: #fff9ea; stroke: #111827; stroke-width: 4; }
    .ink { fill: #111827; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .white { fill: #fff9ea; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .big { font-size: 31px; font-weight: 900; }
    .med { font-size: 22px; font-weight: 850; }
    .small { font-size: 17px; font-weight: 650; }
    .note { font-size: 16px; }
    .outline { stroke: #111827; stroke-width: 4; }
    .thin { stroke: #111827; stroke-width: 2; fill: none; }
  </style>

  <rect class="bg" width="1800" height="1040"/>
  <text class="ink big" x="54" y="62">Batch 8 - Palette Application Studies</text>
  <text class="ink med" x="54" y="98">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="128">Same tiny storefront fragment, three color applications. These are not final palette approvals.</text>

  <defs>
    <g id="scene">
      <polygon points="35,370 420,275 452,360 68,465" fill="var(--street)" class="outline"/>
      <polygon points="52,238 390,158 420,275 35,370" fill="var(--sidewalk)" class="outline"/>
      <polygon points="92,120 250,80 250,325 92,365" fill="var(--brick)" class="outline"/>
      <polygon points="250,80 405,120 405,365 250,325" fill="var(--cream)" class="outline"/>
      <polygon points="112,158 230,130 230,178 112,206" fill="var(--sign)" class="outline"/>
      <text class="ink small" x="126" y="176" transform="rotate(-13 126 176)">Peter Pan</text>
      <rect x="286" y="145" width="46" height="60" fill="var(--glass)" class="outline"/>
      <rect x="346" y="162" width="42" height="58" fill="var(--glass)" class="outline"/>
      <rect x="132" y="250" width="76" height="92" fill="var(--door)" class="outline"/>
      <rect x="282" y="265" width="92" height="60" fill="var(--glass)" class="outline"/>
      <rect x="330" y="228" width="72" height="32" fill="var(--green)" class="outline"/>
      <polygon points="172,42 196,76 172,110 148,76" fill="var(--marker)" class="outline"/>
      <rect x="208" y="38" width="176" height="50" fill="var(--label)" class="outline"/>
      <rect x="208" y="38" width="18" height="50" fill="var(--accent)" class="outline"/>
      <text class="ink small" x="238" y="70">Peter Pan</text>
      <rect x="320" y="350" width="90" height="68" fill="var(--green)" class="outline"/>
      <text class="white med" x="354" y="394">G</text>
    </g>
  </defs>

  <g transform="translate(70 185)" style="--street:#667179;--sidewalk:#d8cebb;--brick:#a94e3f;--cream:#efd8ad;--sign:#ffd46d;--glass:#92aeb2;--door:#163869;--green:#2f7d5b;--marker:#b7ff3c;--label:#fff9ea;--accent:#d04f3e;">
    <rect class="panel" width="520" height="700"/>
    <text class="ink med" x="28" y="48">1. World-grounded + loud cue</text>
    <use href="#scene" x="30" y="125"/>
    <text class="ink small" x="28" y="615">Best for: storefront readability.</text>
    <text class="ink small" x="28" y="645">Risk: may need more OCCII warmth.</text>
  </g>

  <g transform="translate(640 185)" style="--street:#53616f;--sidewalk:#d8d0c4;--brick:#98483f;--cream:#f1e6cd;--sign:#ffffff;--glass:#91a3b5;--door:#0d2d5c;--green:#235d49;--marker:#42d96b;--label:#ffffff;--accent:#0d2d5c;">
    <rect class="panel" width="520" height="700"/>
    <text class="ink med" x="28" y="48">2. OCCII-influenced UI layer</text>
    <use href="#scene" x="30" y="125"/>
    <text class="ink small" x="28" y="615">Best for: community-sim spark.</text>
    <text class="ink small" x="28" y="645">Risk: UI can dominate or feel too literal.</text>
  </g>

  <g transform="translate(1210 185)" style="--street:#6c7170;--sidewalk:#d6c9ad;--brick:#b75a44;--cream:#ead1a0;--sign:#f3c15e;--glass:#849da3;--door:#234d42;--green:#2f7d5b;--marker:#8ee65e;--label:#fff9ea;--accent:#245c8f;">
    <rect class="panel" width="520" height="700"/>
    <text class="ink med" x="28" y="48">3. Warm storefront + civic cue</text>
    <use href="#scene" x="30" y="125"/>
    <text class="ink small" x="28" y="615">Best for: local warmth and clarity.</text>
    <text class="ink small" x="28" y="645">Risk: may become too polite.</text>
  </g>

  <text class="ink note" x="54" y="965">Decision use: choose which applied palette deserves refinement; do not approve final palette from this board alone.</text>
</svg>

