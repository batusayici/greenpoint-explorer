<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Batch 8 applied style tiles</title>
  <desc id="desc">Lo-fi exploratory applied style tiles for Balanced hybrid Community Pixel Storefront.</desc>
  <style>
    .bg { fill: #f7eddc; }
    .panel { fill: #fff9ea; stroke: #111827; stroke-width: 4; }
    .ink { fill: #111827; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .white { fill: #fff9ea; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .big { font-size: 31px; font-weight: 900; }
    .med { font-size: 22px; font-weight: 850; }
    .small { font-size: 17px; font-weight: 650; }
    .note { font-size: 16px; }
    .brick { fill: #a94e3f; stroke: #111827; stroke-width: 5; }
    .brick-line { stroke: #74352f; stroke-width: 2; opacity: .55; }
    .cream { fill: #efd8ad; stroke: #111827; stroke-width: 5; }
    .glass { fill: #92aeb2; stroke: #111827; stroke-width: 3; }
    .dark { fill: #163869; stroke: #111827; stroke-width: 4; }
    .green { fill: #2f7d5b; stroke: #111827; stroke-width: 4; }
    .sidewalk { fill: #d8cebb; stroke: #111827; stroke-width: 4; }
    .asphalt { fill: #667179; stroke: #111827; stroke-width: 4; }
    .accent { fill: #b7ff3c; stroke: #111827; stroke-width: 4; }
    .red { fill: #d04f3e; stroke: #111827; stroke-width: 4; }
    .yellow { fill: #ffd46d; stroke: #111827; stroke-width: 4; }
    .thin { stroke: #111827; stroke-width: 2; fill: none; }
  </style>

  <rect class="bg" width="1800" height="1040"/>
  <text class="ink big" x="54" y="62">Batch 8 - Applied Style Tiles</text>
  <text class="ink med" x="54" y="98">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="128">Balanced hybrid default: storefront/map clarity leads; OCCII/community energy stays in markers, cards, labels, and accents.</text>

  <g transform="translate(70 180)">
    <rect class="panel" width="520" height="700"/>
    <text class="ink med" x="28" y="48">1. Storefront facade</text>
    <text class="ink note" x="28" y="78">Greenpoint anchor through sign band, brick rhythm, awning, windows.</text>

    <g transform="translate(75 150)">
      <polygon class="brick" points="0,95 180,48 180,330 0,382"/>
      <polygon class="cream" points="180,48 350,94 350,382 180,330"/>
      <line class="brick-line" x1="18" y1="122" x2="162" y2="86"/>
      <line class="brick-line" x1="18" y1="162" x2="162" y2="126"/>
      <line class="brick-line" x1="18" y1="202" x2="162" y2="166"/>
      <line class="brick-line" x1="18" y1="242" x2="162" y2="206"/>
      <line class="brick-line" x1="18" y1="282" x2="162" y2="246"/>
      <rect class="glass" x="220" y="118" width="44" height="54"/>
      <rect class="glass" x="286" y="136" width="44" height="54"/>
      <polygon class="yellow" points="24,140 162,104 162,158 24,194"/>
      <text class="ink small" x="41" y="158" transform="rotate(-14 41 158)">Peter Pan</text>
      <polygon class="green" points="206,226 330,258 330,300 206,270"/>
      <rect class="dark" x="52" y="236" width="82" height="112"/>
      <rect class="glass" x="206" y="286" width="118" height="66"/>
    </g>

    <text class="ink small" x="28" y="620">Test: does local storefront read before UI?</text>
    <text class="ink small" x="28" y="650">Avoid: stock isometric building with label pasted on.</text>
  </g>

  <g transform="translate(640 180)">
    <rect class="panel" width="520" height="700"/>
    <text class="ink med" x="28" y="48">2. Sidewalk detail level</text>
    <text class="ink note" x="28" y="78">Medium-high detail at street height; upper buildings stay calmer.</text>

    <g transform="translate(55 175)">
      <polygon class="asphalt" points="28,282 420,184 450,268 62,382"/>
      <polygon class="sidewalk" points="42,150 392,62 420,184 28,282"/>
      <rect class="green" x="96" y="124" width="74" height="38"/>
      <line class="thin" x1="110" y1="140" x2="110" y2="235"/>
      <circle class="green" cx="111" cy="110" r="26"/>
      <rect class="dark" x="214" y="102" width="34" height="116"/>
      <text class="white small" x="224" y="176">G</text>
      <rect class="red" x="285" y="150" width="66" height="48"/>
      <text class="white small" x="296" y="180">sign</text>
      <circle class="thin" cx="198" cy="246" r="28"/>
      <circle class="thin" cx="274" cy="228" r="28"/>
      <line class="thin" x1="198" y1="246" x2="274" y2="228"/>
      <line class="thin" x1="236" y1="238" x2="222" y2="202"/>
      <rect class="accent" x="354" y="206" width="28" height="20"/>
      <rect class="dark" x="376" y="200" width="22" height="28"/>
    </g>

    <text class="ink small" x="28" y="620">Test: lively sidewalk, not prop clutter soup.</text>
    <text class="ink small" x="28" y="650">Avoid: anything implying NPCs, quests, or event systems.</text>
  </g>

  <g transform="translate(1210 180)">
    <rect class="panel" width="520" height="700"/>
    <text class="ink med" x="28" y="48">3. UI accent restraint</text>
    <text class="ink note" x="28" y="78">OCCII/community spark appears as punctuating layer, not map takeover.</text>

    <g transform="translate(78 145)">
      <polygon class="brick" points="0,100 168,58 168,300 0,340"/>
      <polygon class="cream" points="168,58 330,100 330,342 168,300"/>
      <polygon class="yellow" points="24,138 150,108 150,156 24,186"/>
      <text class="ink small" x="42" y="154" transform="rotate(-13 42 154)">Peter Pan</text>
      <polygon class="accent" points="86,18 110,52 86,86 62,52"/>
      <rect class="panel" x="138" y="-10" width="176" height="48"/>
      <text class="ink small" x="158" y="21">Peter Pan</text>
      <rect class="dark" x="88" y="365" width="250" height="108"/>
      <text class="white med" x="110" y="404">Hybrid card header</text>
      <rect class="panel" x="108" y="424" width="210" height="70"/>
      <text class="ink small" x="124" y="452">Factual copy area</text>
      <text class="ink note" x="124" y="478">source + disclaimer</text>
    </g>

    <text class="ink small" x="28" y="620">Test: UI helps discovery but storefront still leads.</text>
    <text class="ink small" x="28" y="650">Avoid: flyer/event card or social-sim character cue.</text>
  </g>
</svg>

