<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Batch 8 mini composition tests</title>
  <desc id="desc">Lo-fi exploratory composition tests for Community Pixel Storefront.</desc>
  <style>
    .bg { fill: #f6eddc; }
    .panel { fill: #fff9ea; stroke: #151515; stroke-width: 4; }
    .street { fill: #5f6b72; stroke: #151515; stroke-width: 4; }
    .sidewalk { fill: #d8cfbd; stroke: #151515; stroke-width: 3; }
    .brick { fill: #a94e3f; stroke: #151515; stroke-width: 4; }
    .cream { fill: #efd9ad; stroke: #151515; stroke-width: 4; }
    .awning { fill: #2f7d5b; stroke: #151515; stroke-width: 3; }
    .bakery { fill: #ffd36a; stroke: #151515; stroke-width: 3; }
    .station { fill: #2fad63; stroke: #151515; stroke-width: 4; }
    .karczma { fill: #c84d3a; stroke: #151515; stroke-width: 4; }
    .placeholder { fill: none; stroke: #151515; stroke-width: 3; stroke-dasharray: 10 8; }
    .marker { fill: #b7ff3c; stroke: #151515; stroke-width: 4; }
    .accent { fill: #163869; stroke: #151515; stroke-width: 3; }
    .ink { fill: #151515; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .white { fill: #fff9ea; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .big { font-size: 31px; font-weight: 900; }
    .med { font-size: 22px; font-weight: 800; }
    .small { font-size: 17px; font-weight: 650; }
    .note { font-size: 16px; }
  </style>

  <rect class="bg" width="1800" height="1040"/>
  <text class="ink big" x="54" y="62">Batch 8 - Mini Composition Tests</text>
  <text class="ink med" x="54" y="98">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="128">Community Pixel Storefront is a test path, not an approved final style. These are blockouts, not static style frames.</text>

  <g transform="translate(70 175)">
    <rect class="panel" x="0" y="0" width="780" height="720" rx="0"/>
    <text class="ink med" x="26" y="46">Option A: compact Peter Pan + G station</text>
    <text class="ink note" x="26" y="76">Purpose: test local specificity without forcing Karczma into the first frame.</text>

    <polygon class="street" points="60,465 690,315 725,420 100,595"/>
    <polygon class="sidewalk" points="75,340 640,210 690,315 60,465"/>
    <polygon class="sidewalk" points="100,595 725,420 735,505 142,680"/>

    <g transform="translate(130 205)">
      <polygon class="brick" points="0,115 180,70 180,260 0,305"/>
      <polygon class="cream" points="180,70 360,115 360,305 180,260"/>
      <polygon class="bakery" points="24,150 164,116 164,164 24,198"/>
      <text class="ink small" x="38" y="166" transform="rotate(-14 38 166)">Peter Pan</text>
      <rect class="awning" x="220" y="156" width="98" height="38"/>
      <rect class="accent" x="212" y="218" width="122" height="70"/>
      <text class="white small" x="224" y="260">bakery</text>
      <polygon class="marker" points="90,42 112,73 90,104 68,73"/>
    </g>

    <g transform="translate(470 265)">
      <rect class="station" x="0" y="0" width="108" height="84"/>
      <text class="white med" x="38" y="52">G</text>
      <rect class="station" x="126" y="-42" width="54" height="126"/>
      <text class="ink small" x="-12" y="120">G station anchor</text>
    </g>

    <g transform="translate(385 190)">
      <polygon class="placeholder" points="0,80 135,46 135,196 0,230"/>
      <polygon class="placeholder" points="135,46 260,78 260,226 135,196"/>
      <text class="ink small" x="30" y="255">placeholder storefronts</text>
    </g>

    <text class="ink small" x="26" y="640">Read: compact, clearer, lower risk of false adjacency.</text>
    <text class="ink small" x="26" y="674">Question: is Peter Pan + G station enough local pull for the first frame?</text>
  </g>

  <g transform="translate(950 175)">
    <rect class="panel" x="0" y="0" width="780" height="720" rx="0"/>
    <text class="ink med" x="26" y="46">Option B: Karczma included as stress test</text>
    <text class="ink note" x="26" y="76">Purpose: test whether Karczma can appear without false adjacency or too-wide composition.</text>

    <polygon class="street" points="80,480 705,330 735,435 110,610"/>
    <polygon class="sidewalk" points="92,345 650,218 705,330 80,480"/>
    <polygon class="sidewalk" points="110,610 735,435 742,520 150,692"/>
    <polygon class="street" points="438,185 590,220 320,690 188,655"/>

    <g transform="translate(115 225)">
      <polygon class="brick" points="0,105 148,70 148,245 0,280"/>
      <polygon class="cream" points="148,70 292,104 292,278 148,245"/>
      <polygon class="bakery" points="20,136 132,110 132,154 20,182"/>
      <text class="ink small" x="32" y="152" transform="rotate(-13 32 152)">Peter Pan</text>
      <polygon class="marker" points="72,34 94,65 72,96 50,65"/>
    </g>

    <g transform="translate(420 245)">
      <polygon class="karczma" points="0,98 150,62 150,226 0,262"/>
      <polygon class="cream" points="150,62 294,96 294,260 150,226"/>
      <rect class="accent" x="26" y="132" width="108" height="44"/>
      <text class="white small" x="34" y="160">Karczma</text>
      <polygon class="marker" points="78,28 100,59 78,90 56,59"/>
    </g>

    <g transform="translate(322 335)">
      <rect class="station" x="0" y="0" width="96" height="72"/>
      <text class="white med" x="34" y="47">G</text>
      <text class="ink small" x="-34" y="108">transit anchor</text>
    </g>

    <text class="ink small" x="26" y="640">Read: richer anchor set, but highest geography/compression risk.</text>
    <text class="ink small" x="26" y="674">Question: does this feel honest, or should Karczma wait for later expansion?</text>
  </g>

  <text class="ink note" x="54" y="965">Decision use: pick compact composition, keep testing Karczma, or reject Karczma in first frame if spatial honesty feels strained.</text>
</svg>

