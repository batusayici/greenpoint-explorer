<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Batch 7 palette studies</title>
  <desc id="desc">Lo-fi exploratory palette studies for Community Pixel Storefront.</desc>
  <defs>
    <style>
      .bg { fill: #f3ecd8; }
      .panel { fill: #fff9ea; stroke: #111827; stroke-width: 4; }
      .ink { fill: #111827; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .big { font-size: 38px; font-weight: 900; }
      .med { font-size: 24px; font-weight: 800; }
      .small { font-size: 17px; }
      .note { fill: #374151; font-size: 15px; }
      .swatch { stroke: #111827; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1800" height="1050"/>
  <text class="ink big" x="54" y="64">Community Pixel Storefront - Palette Studies</text>
  <text class="ink med" x="54" y="100">lo-fi / exploratory / not final</text>
  <text class="ink note" x="54" y="130">Tests color relationships only. Not final palette, not final art.</text>

  <rect class="panel" x="54" y="170" width="530" height="765"/>
  <text class="ink med" x="84" y="215">1. World-grounded + one loud accent</text>
  <text class="ink note" x="84" y="244">Greenpoint storefront world stays dominant; UI gets one high-energy cue.</text>
  <g transform="translate(86 295)">
    <rect class="swatch" x="0" y="0" width="120" height="120" fill="#b95843"/><text class="ink small" x="0" y="152">brick red</text>
    <rect class="swatch" x="150" y="0" width="120" height="120" fill="#f0d994"/><text class="ink small" x="150" y="152">bakery cream</text>
    <rect class="swatch" x="300" y="0" width="120" height="120" fill="#5b6970"/><text class="ink small" x="300" y="152">asphalt blue-gray</text>
    <rect class="swatch" x="0" y="205" width="120" height="120" fill="#5d8f67"/><text class="ink small" x="0" y="357">aged green</text>
    <rect class="swatch" x="150" y="205" width="120" height="120" fill="#fff9ea"/><text class="ink small" x="150" y="357">warm paper</text>
    <rect class="swatch" x="300" y="205" width="120" height="120" fill="#dfff3f"/><text class="ink small" x="300" y="357">loud accent</text>
  </g>
  <text class="ink small" x="84" y="750">Best for: balanced hybrid.</text>
  <text class="ink small" x="84" y="790">Risk: may need stronger OCCII warmth if too quiet.</text>

  <rect class="panel" x="635" y="170" width="530" height="765"/>
  <text class="ink med" x="665" y="215">2. OCCII-influenced navy / white / green</text>
  <text class="ink note" x="665" y="244">Most event-like and social; strongest UI personality.</text>
  <g transform="translate(667 295)">
    <rect class="swatch" x="0" y="0" width="120" height="120" fill="#071f5f"/><text class="ink small" x="0" y="152">deep navy</text>
    <rect class="swatch" x="150" y="0" width="120" height="120" fill="#ffffff"/><text class="ink small" x="150" y="152">white type</text>
    <rect class="swatch" x="300" y="0" width="120" height="120" fill="#42d96b"/><text class="ink small" x="300" y="152">marker green</text>
    <rect class="swatch" x="0" y="205" width="120" height="120" fill="#c47a43"/><text class="ink small" x="0" y="357">warm wood</text>
    <rect class="swatch" x="150" y="205" width="120" height="120" fill="#8cced8"/><text class="ink small" x="150" y="357">cool floor blue</text>
    <rect class="swatch" x="300" y="205" width="120" height="120" fill="#f16648"/><text class="ink small" x="300" y="357">small red</text>
  </g>
  <text class="ink small" x="665" y="750">Best for: community-heavy.</text>
  <text class="ink small" x="665" y="790">Risk: too close to OCCII; UI may dominate.</text>

  <rect class="panel" x="1216" y="170" width="530" height="765"/>
  <text class="ink med" x="1246" y="215">3. Warm storefront + civic markers</text>
  <text class="ink note" x="1246" y="244">Most restrained; factual-place clarity with small flyer warmth.</text>
  <g transform="translate(1248 295)">
    <rect class="swatch" x="0" y="0" width="120" height="120" fill="#a84f3e"/><text class="ink small" x="0" y="152">old brick</text>
    <rect class="swatch" x="150" y="0" width="120" height="120" fill="#ead7ae"/><text class="ink small" x="150" y="152">aged cream</text>
    <rect class="swatch" x="300" y="0" width="120" height="120" fill="#41545c"/><text class="ink small" x="300" y="152">street gray</text>
    <rect class="swatch" x="0" y="205" width="120" height="120" fill="#2f7d57"/><text class="ink small" x="0" y="357">civic green</text>
    <rect class="swatch" x="150" y="205" width="120" height="120" fill="#111827"/><text class="ink small" x="150" y="357">ink black</text>
    <rect class="swatch" x="300" y="205" width="120" height="120" fill="#f3b84f"/><text class="ink small" x="300" y="357">small warmth</text>
  </g>
  <text class="ink small" x="1246" y="750">Best for: civic-heavy.</text>
  <text class="ink small" x="1246" y="790">Risk: too polite; may lose invitation.</text>

  <text class="ink note" x="54" y="1002">Decision prompt: Which palette gives Greenpoint enough reality while keeping the OCCII/community spark alive?</text>
</svg>

