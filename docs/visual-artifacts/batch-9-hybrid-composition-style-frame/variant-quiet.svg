<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Batch 9 revised quiet hybrid composition style-frame</title>
  <desc id="desc">Calm documentary near-isometric storefront composition with symbolic Peter Pan, symbolic Greenpoint Av G station, placeholder storefronts, street furniture, and restrained UI hierarchy.</desc>
  <style>
    text { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #1d1a16; }
    .eyebrow { font-size: 17px; font-weight: 800; text-transform: uppercase; }
    .h1 { font-size: 38px; font-weight: 850; }
    .body { font-size: 17px; }
    .label { font-size: 18px; font-weight: 850; }
    .small { font-size: 14px; font-weight: 700; }
    .tiny { font-size: 12px; font-weight: 750; text-transform: uppercase; }
  </style>

  <rect width="1600" height="1040" fill="#efe8dc"/>
  <text x="42" y="52" class="eyebrow">Batch 9 revised / quiet / exploratory / not final</text>
  <text x="42" y="92" class="h1">Calm, documentary, sparse, still place-specific</text>
  <text x="42" y="124" class="body">Same base slice as the other revised variants. The test is whether low visual volume can still feel locally anchored and clickable.</text>

  <!-- base corner ground plane -->
  <polygon points="115,676 770,314 1458,660 801,1008" fill="#89918d"/>
  <polygon points="220,650 770,350 1358,644 804,938" fill="#d8d0bd" stroke="#22201d" stroke-width="4"/>
  <polygon points="296,641 770,386 1280,641 804,894" fill="#c9bda7" stroke="#22201d" stroke-width="3"/>
  <polygon points="150,746 296,641 804,894 660,984" fill="#7f8986"/>
  <polygon points="1280,641 1430,718 954,974 804,894" fill="#7d8784"/>
  <line x1="398" y1="702" x2="546" y2="624" stroke="#f5efe2" stroke-width="9"/>
  <line x1="935" y1="694" x2="1090" y2="616" stroke="#f5efe2" stroke-width="9"/>
  <line x1="692" y1="862" x2="846" y2="780" stroke="#f5efe2" stroke-width="9"/>
  <line x1="1210" y1="680" x2="1304" y2="729" stroke="#f5efe2" stroke-width="9"/>

  <!-- storefront mass, common five-bay structure -->
  <g id="base-storefronts" stroke="#22201d" stroke-linejoin="round">
    <polygon points="334,438 764,204 1118,381 688,622" fill="#d1b993" stroke-width="4"/>
    <polygon points="334,438 688,622 688,782 334,598" fill="#b79d78" stroke-width="4"/>
    <polygon points="688,622 1118,381 1118,532 688,782" fill="#c5aa82" stroke-width="4"/>
    <polyline points="352,424 764,201 1100,369" fill="none" stroke="#564b3e" stroke-width="10"/>

    <!-- fictional bay 1 -->
    <polygon points="358,468 472,406 472,568 358,632" fill="#e7cfaa" stroke-width="3"/>
    <polygon points="358,468 472,406 472,444 358,506" fill="#ba8d5b" stroke-width="3"/>
    <polygon points="381,517 423,494 423,592 381,615" fill="#5f756f" stroke-width="3"/>
    <polygon points="431,491 457,477 457,546 431,560" fill="#dce4dd" stroke-width="2"/>
    <line x1="381" y1="557" x2="423" y2="535" stroke="#e9eee9" stroke-width="2"/>
    <text x="367" y="495" class="tiny" transform="rotate(-28 367 495)">FICTIONAL</text>
    <text x="368" y="529" class="small" transform="rotate(-28 368 529)">Moss Goods</text>

    <!-- Peter Pan symbolic bay -->
    <polygon points="493,394 632,318 632,482 493,560" fill="#f5d379" stroke-width="3"/>
    <polygon points="493,394 632,318 632,360 493,436" fill="#e7ad37" stroke-width="3"/>
    <polygon points="515,455 568,426 568,526 515,556" fill="#42645c" stroke-width="3"/>
    <polygon points="579,421 615,401 615,478 579,499" fill="#fff2bd" stroke-width="3"/>
    <path d="M500 444 L625 376" stroke="#fff4c3" stroke-width="11"/>
    <path d="M500 444 L625 376" stroke="#ba4a35" stroke-width="3" stroke-dasharray="12 10"/>
    <circle cx="598" cy="388" r="13" fill="#f6c56b" stroke-width="3"/>
    <circle cx="598" cy="388" r="5" fill="#5b3b25"/>
    <text x="505" y="424" class="label" transform="rotate(-28 505 424)">PETER PAN</text>
    <text x="520" y="452" class="tiny" transform="rotate(-28 520 452)">SYMBOLIC ANCHOR</text>

    <!-- placeholder bay -->
    <polygon points="653,306 790,232 790,396 653,472" fill="#d7dad1" stroke-width="3"/>
    <polygon points="653,306 790,232 790,272 653,347" fill="#8da89e" stroke-width="3"/>
    <polygon points="675,367 733,335 733,433 675,466" fill="#586d68" stroke-width="3"/>
    <polygon points="744,330 775,313 775,383 744,400" fill="#edf1ed" stroke-width="2"/>
    <rect x="681" y="382" width="44" height="10" fill="#e9ede7" transform="rotate(-28 681 382)"/>
    <text x="662" y="335" class="tiny" transform="rotate(-28 662 335)">PLACEHOLDER</text>
    <text x="674" y="365" class="small" transform="rotate(-28 674 365)">Bay not real</text>

    <!-- fictional corner bay -->
    <polygon points="813,233 960,306 960,474 813,398" fill="#dfc0ad" stroke-width="3"/>
    <polygon points="813,233 960,306 960,348 813,274" fill="#b7786c" stroke-width="3"/>
    <polygon points="835,306 884,331 884,432 835,407" fill="#526863" stroke-width="3"/>
    <polygon points="895,335 936,356 936,438 895,417" fill="#ecf0e9" stroke-width="2"/>
    <text x="830" y="272" class="tiny" transform="rotate(27 830 272)">FICTIONAL</text>
    <text x="850" y="313" class="small" transform="rotate(27 850 313)">Corner Pantry</text>

    <!-- unresolved bay -->
    <polygon points="978,316 1086,372 1086,542 978,484" fill="#c8d0ca" stroke-width="3"/>
    <polygon points="978,316 1086,372 1086,414 978,358" fill="#7f9790" stroke-width="3"/>
    <polygon points="1000,391 1058,421 1058,504 1000,474" fill="#596c68" stroke-width="3"/>
    <text x="992" y="356" class="tiny" transform="rotate(27 992 356)">UNRESOLVED</text>
    <text x="1005" y="396" class="small" transform="rotate(27 1005 396)">Massing only</text>
  </g>

  <!-- integrated G station corner -->
  <g id="g-station-integrated" stroke="#22201d" stroke-linejoin="round">
    <polygon points="828,684 966,608 1084,667 945,744" fill="#b7bdb7" stroke-width="4"/>
    <polygon points="862,668 954,618 1034,658 941,709" fill="#4f5d5a" stroke-width="3"/>
    <line x1="882" y1="667" x2="949" y2="703" stroke="#d7ded8" stroke-width="5"/>
    <line x1="904" y1="654" x2="972" y2="690" stroke="#d7ded8" stroke-width="5"/>
    <line x1="925" y1="641" x2="994" y2="677" stroke="#d7ded8" stroke-width="5"/>
    <polyline points="847,662 847,628 945,577 1057,633 1057,666" fill="none" stroke-width="4"/>
    <circle cx="1000" cy="617" r="31" fill="#65a86b" stroke-width="4"/>
    <text x="989" y="628" font-size="34" font-weight="900" fill="#ffffff">G</text>
  </g>

  <!-- quiet street context -->
  <g id="street-context" stroke="#22201d" stroke-linejoin="round">
    <rect x="430" y="726" width="74" height="25" rx="3" fill="#657068" stroke-width="3"/>
    <line x1="446" y1="751" x2="435" y2="780" stroke-width="3"/>
    <line x1="488" y1="751" x2="499" y2="780" stroke-width="3"/>
    <rect x="1120" y="698" width="42" height="60" rx="5" fill="#66736f" stroke-width="3"/>
    <rect x="1184" y="668" width="58" height="34" fill="#e7d7af" stroke-width="3"/>
    <line x1="1200" y1="702" x2="1190" y2="730" stroke-width="3"/>
    <line x1="1226" y1="702" x2="1236" y2="730" stroke-width="3"/>
    <line x1="248" y1="626" x2="248" y2="520" stroke-width="4"/>
    <circle cx="248" cy="506" r="19" fill="#f0d681" stroke-width="3"/>
    <rect x="632" y="748" width="34" height="46" fill="#9f7459" stroke-width="3"/>
    <circle cx="638" cy="741" r="16" fill="#819a73" stroke-width="3"/>
    <circle cx="660" cy="737" r="17" fill="#718a67" stroke-width="3"/>
    <rect x="746" y="714" width="56" height="28" fill="#777f7b" stroke-width="3"/>
    <line x1="752" y1="720" x2="794" y2="740" stroke="#d2d8d2" stroke-width="2"/>
    <line x1="794" y1="720" x2="752" y2="740" stroke="#d2d8d2" stroke-width="2"/>
  </g>

  <!-- restrained UI -->
  <g id="ui-quiet">
    <line x1="574" y1="368" x2="590" y2="260" stroke="#5b4c39" stroke-width="3"/>
    <circle cx="590" cy="260" r="18" fill="#f4c95d" stroke="#22201d" stroke-width="4"/>
    <rect x="620" y="228" width="188" height="68" rx="6" fill="#fff9ed" stroke="#22201d" stroke-width="3"/>
    <text x="638" y="254" class="small">Peter Pan</text>
    <text x="638" y="276" class="tiny">symbolic, not exact facade</text>

    <line x1="1000" y1="617" x2="1230" y2="486" stroke="#5b4c39" stroke-width="3"/>
    <rect x="1212" y="415" width="286" height="112" rx="6" fill="#fff9ed" stroke="#22201d" stroke-width="4"/>
    <text x="1234" y="446" class="tiny">UI CARD TEST / QUIET</text>
    <text x="1234" y="476" class="label">G station anchor</text>
    <text x="1234" y="501" class="body">Small factual orientation cue.</text>
  </g>

  <!-- truth legend -->
  <g id="legend">
    <rect x="42" y="742" width="352" height="226" rx="6" fill="#fff9ed" stroke="#22201d" stroke-width="4"/>
    <text x="66" y="778" class="label">Truth-status legend</text>
    <circle cx="76" cy="814" r="9" fill="#d6ece2" stroke="#22201d" stroke-width="2"/><text x="98" y="820" class="body">verified: source context only</text>
    <circle cx="76" cy="848" r="9" fill="#f4c95d" stroke="#22201d" stroke-width="2"/><text x="98" y="854" class="body">symbolic: Peter Pan, G station</text>
    <circle cx="76" cy="882" r="9" fill="#d7dad1" stroke="#22201d" stroke-width="2"/><text x="98" y="888" class="body">placeholder storefront</text>
    <circle cx="76" cy="916" r="9" fill="#dfc0ad" stroke="#22201d" stroke-width="2"/><text x="98" y="922" class="body">fictionalized storefront</text>
    <circle cx="76" cy="950" r="9" fill="#c8d0ca" stroke="#22201d" stroke-width="2"/><text x="98" y="956" class="body">unresolved massing</text>
  </g>

  <g id="disclaimer">
    <rect x="978" y="916" width="548" height="62" rx="6" fill="#fff9ed" stroke="#22201d" stroke-width="3"/>
    <text x="1000" y="942" class="body">No real-place cards. No exact placement claims.</text>
    <text x="1000" y="966" class="body">Other storefronts remain fictionalized, placeholder, or unresolved.</text>
  </g>
</svg>
