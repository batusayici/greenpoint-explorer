    <circle cx="76" cy="916" r="9" fill="#eda281" stroke="#211a15" stroke-width="2"/><text x="98" y="922" class="body">fictionalized storefront</text>
    <circle cx="76" cy="950" r="9" fill="#accbc1" stroke="#211a15" stroke-width="2"/><text x="98" y="956" class="body">unresolved massing</text>
