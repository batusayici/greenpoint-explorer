    <rect x="632" y="748" width="34" height="46" fill="#a86142" stroke-width="3"/>
    <circle cx="638" cy="741" r="16" fill="#589855" stroke-width="3"/>
    <circle cx="660" cy="737" r="17" fill="#49884b" stroke-width="3"/>
