    .eyebrow { font-size: 17px; font-weight: 800; text-transform: uppercase; }
    .h1 { font-size: 38px; font-weight: 850; }
    .body { font-size: 17px; }
    .label { font-size: 18px; font-weight: 850; }
    .small { font-size: 14px; font-weight: 750; }
    .tiny { font-size: 12px; font-weight: 800; text-transform: uppercase; }
  </style>

