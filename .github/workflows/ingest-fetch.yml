# Fetch every ingest source on a plain runner and publish the snapshots, so the
# Claude routine never fetches through the cloud sandbox's proxy again
# (spec: docs/superpowers/specs/2026-09-08-ingest-fetch-on-github-actions-design.md).
#
# This job reads untrusted web pages. It must never hold a credential that can
# write this repo: contents is read-only, and the only secret is a deploy key
# scoped to the snapshots repo. The repo's Actions default is read-only too.
name: ingest-fetch

on:
  schedule:
    - cron: "30 10 * * *" # 6:30am New York in summer (5:30 in winter); the home Mac follows at 7:15, the routine at 8:30
  workflow_dispatch:
    inputs:
      only:
        # PROBE MODE. A candidate source has to be fetched before it can be
        # judged, and the sandbox cannot reach most hosts — this is how a
        # roster hopeful gets measured (2026-09-12). Nothing is published when
        # it is set: a 2-source run would otherwise replace the whole bundle
        # in the snapshots repo with two sources' worth of snapshots.
        description: "Comma-separated source ids to fetch instead of the whole roster. Probe mode — measures and prints, publishes nothing."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # A secret cannot be tested in a step `if:` directly; surface its presence here.
      HAS_KEY: ${{ secrets.SNAPSHOTS_DEPLOY_KEY != '' }}
      SNAPSHOTS_REPO: git@github.com:batusayici/stoopwise-snapshots.git
      # `inputs` is null on a schedule, so coerce here rather than comparing a
      # null property in a step `if:`. Empty = normal full-roster run.
      ONLY: ${{ inputs.only || '' }}
    steps:
      # Nothing in this job uses the workflow token, and the job reads untrusted
      # pages: don't leave a credential for this repo in the checkout's git config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox

      # Exit 1 here means the roster was not readable (>15% errored). The
      # report still has to be published so the routine halts on the same
      # evidence, so do not fail the job yet.
      # ONLY goes through the environment, never interpolated into the command:
      # a dispatch input is caller-controlled text and this job runs with a
      # deploy key in reach.
      - id: fetch
        run: |
          if [ -n "$ONLY" ]; then
            # --allow-degraded in probe mode: a probe deliberately tries URLs
            # that may not exist, and with two or three sources a single 404
            # blows through the 15% ceiling and reports a healthy roster as
            # unreadable. The ceiling is there to stop a thin ingest shipping;
            # a probe ingests nothing.
            npm run ingest:fetch -- --include-monthly --allow-degraded --only "$ONLY"
          else
            npm run ingest:fetch -- --include-monthly
          fi
        continue-on-error: true
        env:
          TROOST_CALENDAR_API_KEY: ${{ secrets.TROOST_CALENDAR_API_KEY }}

      # Probe mode's whole output is what it prints. The per-source log line
      # carries no size, and a brand-new source has no diff to read, so print
      # the byte count and the head of each snapshot — that is what tells a
      # real listing apart from a page of navigation (the Threes Brewing shape:
      # 3,061 characters, none of it an event).
      - name: Print the probe measurement
        if: always() && env.ONLY != ''
        run: |
          echo "=== changes.json ==="
          cat .ingest-cache/changes.json || echo "(no report written)"
          for f in .ingest-cache/*.txt; do
            case "$f" in *.ingested.txt|*.diff.txt) continue ;; esac
            echo "=== $f — $(wc -c < "$f") bytes, $(wc -l < "$f") lines ==="
            head -c 8000 "$f"
            echo
          done

      # Always available, key or no key — this is what the dry run compares.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-report
          path: .ingest-cache/changes.json
          retention-days: 14
          if-no-files-found: error

      - name: Publish the bundle to the snapshots repo
        if: env.HAS_KEY == 'true' && env.ONLY == ''
        env:
          DEPLOY_KEY: ${{ secrets.SNAPSHOTS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519)
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git clone --depth 1 "$SNAPSHOTS_REPO" "$RUNNER_TEMP/snapshots"
          npm run -s ingest:publish -- --to "$RUNNER_TEMP/snapshots" --fetcher github --yield-hours 3
          cd "$RUNNER_TEMP/snapshots"
          git config user.name "ingest-fetch"
          git config user.email "ingest-fetch@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed since the last fetch"
          else
            git commit -m "fetch $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA::7}"
            git push origin HEAD
          fi

      - name: Report the roster as unreadable
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::ingest:fetch exited non-zero — the roster was not readable (over the 15% ceiling). The report was still published."
          exit 1
